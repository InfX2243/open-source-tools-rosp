name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[all,dev]"

    - name: Run Pytest Suite
      run: |
        pytest tests/ -v --cov=dataguard --cov-report=xml

    - name: Run Sample CLI Validation Gate
      run: |
        dataguard validate examples/data/customers.csv --config examples/rules/customer_rules.yaml --fail-on high

    - name: Build Wheel & Source Distribution
      run: |
        pip install build
        python -m build
